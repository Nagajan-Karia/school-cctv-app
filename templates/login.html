<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <title>સ્કૂલ CCTV પોર્ટલ - લોગિન</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 98%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .error { color: red; font-size: 14px; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>વાલી લોગિન પોર્ટલ</h2>
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
        <form method="POST">
            <input type="text" name="username" placeholder="યુઝરનેમ (દા.ત. parent1)" required><br>
            <input type="password" name="password" placeholder="પાસવર્ડ (દા.ત. 123456)" required><br>
            <button type="submit">લોગિન કરો</button>
        </form>
    </div>
</body>
</html>
