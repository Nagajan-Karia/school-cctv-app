<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>સ્કૂલ લાઈવ સીસીટીવી પોર્ટલ - ડેશબોર્ડ</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 0; }
        .header { background-color: #007bff; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .logout-btn { background-color: #dc3545; color: white; padding: 8px 15px; text-decoration: none; border-radius: 4px; font-weight: bold; }
        .container { padding: 20px; max-width: 1000px; margin: 0 auto; }
        h2 { text-align: center; color: #333; margin-bottom: 30px; }
        .student-card { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .student-name { font-size: 20px; color: #007bff; font-weight: bold; margin-bottom: 15px; border-bottom: 2px solid #007bff; padding-bottom: 5px; }
        .camera-box { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; background: #000; border-radius: 4px; }
        .camera-box iframe, .camera-box video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        .no-camera { color: #fff; text-align: center; padding-top: 20%; font-size: 16px; }
    </style>
</head>
<body>
    <div class="header">
        <h3 style="margin: 0;">સ્કૂલ લાઈવ સીસીટીવી પોર્ટલ</h3>
        <div>
            <span>વાલી: {{ user_data.username }}</span> | 
            <a href="{{ url_for('logout') }}" class="logout-btn">લોગઆઉટ</a>
        </div>
    </div>

    <div class="container">
        <h2>તમારા બાળકોના ક્લાસરૂમનું લાઈવ પ્રસારણ</h2>
        
        {% for child in user_data.children %}
            <div class="student-card">
                <div class="student-name">બાળકનું નામ: {{ child.name }}</div>
                <div class="camera-box">
                    {% if child.url and child.url != '0' %}
                        <iframe src="{{ child.url }}" allowfullscreen></iframe>
                    {% else %}
                        <div class="no-camera">આ કેમેરા માટે હાલ લિંક ઉપલબ્ધ નથી.</div>
                    {% endif %}
                </div>
            </div>
        {% endfor %}
    </div>
</body>
</html>
