<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <title>મલ્ટી-ચાઇલ્ડ સીસીટીવી ડેશબોર્ડ</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; text-align: center; }
        .header { background: #007bff; color: white; padding: 15px 25px; border-radius: 8px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; }
        
        /* કેમેરા ગ્રીડ લેઆઉટ */
        .grid-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }
        .video-card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 480px;
        }
        .video-card h3 { color: #333; margin-top: 5px; margin-bottom: 15px; }
        img { border-radius: 8px; width: 100%; height: auto; border: 2px solid #ddd; }
        a.logout-btn { color: white; background: #dc3545; padding: 8px 15px; text-decoration: none; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <h2>સ્કૂલ લાઈવ સીસીટીવી પોર્ટલ</h2>
        <div>
            <span>CADMUS SCHOOL parents: <b>{{ user }}</b></span>  |  
            <a href="/logout" class="logout-btn">લોગઆઉટ</a>
        </div>
    </div>

    <h2>તમારા બાળકોના ક્લાસરૂમનું લાઈવ પ્રસારણ</h2>
    
    <div class="grid-container">
        {% for child in children %}
            <div class="video-card">
                <h3>વિદ્યાર્થી: {{ child.name }}</h3>
                <img src="{{ url_for('video_feed', child_id=child.cam_id) }}" alt="લાઈવ ફીડ લોડ થાય છે...">
            </div>
        {% endfor %}
    </div>
</body>
</html>
